<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ MAMA LATINO 2026 ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdf2f8; 
            --card-bg: #ffffff;
            --text-main: #5c4a52; 
            --text-muted: #a78b97;
            --primary: #ff8fb3; 
            --primary-hover: #ff749f;
            --primary-dark: #d81b60; /* Tono rosa más oscuro para el footer */
            --danger: #ffffff; 
            --border: #fce7f3; 
            --bar-gradient: linear-gradient(90deg, #ff9a9e 0%, #fecfef 100%); 
            --banner-gradient: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            background-image: radial-gradient(#ffe4e6 1px, transparent 1px);
            background-size: 20px 20px; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* BANNER SUPERIOR */
        .banner {
            background: var(--banner-gradient);
            padding: 30px 20px;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.3);
            margin-bottom: 40px;
        }

        .banner-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .banner h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .btn-danger {
            background-color: rgba(255, 255, 255, 0.2);
            color: var(--danger);
            border: 2px solid var(--danger);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.4);
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            flex-grow: 1; /* Esto empuja el footer hacia abajo */
            width: 100%;
            box-sizing: border-box;
        }

        /* Grid para los primeros 6 gráficos */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        /* SECCIÓN DE VISUALES */
        .visuals-section {
            margin-top: 60px;
            margin-bottom: 40px;
        }

        .visuals-title {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            color: var(--primary-dark);
            margin-bottom: 30px;
            position: relative;
        }
        
        /* Línea decorativa al lado del título Visuales */
        .visuals-title::before, .visuals-title::after {
            content: "";
            display: inline-block;
            width: 100px;
            height: 3px;
            background: var(--primary);
            vertical-align: middle;
            margin: 0 15px;
            border-radius: 5px;
        }

        /* Grid exclusivo para Visuales (2 columnas 100% ancho) */
        .visuals-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Exactamente mitad y mitad */
            gap: 25px;
        }

        /* TARJETAS DE GRÁFICO (Compartido) */
        .chart-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15);
            transition: transform 0.2s;
        }
        
        .chart-card:hover {
            transform: translateY(-5px);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--border);
        }

        .chart-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
        }

        .chart-actions button {
            background: var(--bg-color);
            border: none;
            color: var(--primary-hover);
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 13px;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            margin-left: 5px;
            font-weight: 700;
            transition: all 0.2s;
        }
        
        .chart-actions button:hover {
            background: var(--primary);
            color: white;
        }

        /* BARRAS Y COMPETIDORES */
        .competitor {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .name {
            width: 95px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .bar-container {
            flex-grow: 1;
            background: var(--border);
            height: 22px;
            border-radius: 12px;
            margin: 0 12px;
            position: relative;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            background: var(--bar-gradient);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: #5c4a52;
            font-weight: 800;
            font-size: 12px;
            box-sizing: border-box;
            min-width: 35px;
            border-radius: 12px;
        }

        .controls button {
            background: var(--bg-color);
            border: none;
            color: var(--primary);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 4px;
            transition: all 0.2s;
        }

        .controls button:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            padding: 30px 0;
            background: var(--bg-color);
            border-radius: 16px;
            border: 2px dashed var(--border);
        }

        /* FOOTER */
        .site-footer {
            background-color: var(--primary-dark);
            color: white;
            text-align: center;
            padding: 25px 20px;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-top: 50px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Adaptabilidad para móviles */
        @media (max-width: 768px) {
            .visuals-grid {
                grid-template-columns: 1fr; /* En celular se pondrán una sobre otra para que quepan */
            }
            .visuals-title::before, .visuals-title::after {
                width: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- BANNER -->
    <header class="banner">
        <div class="banner-content">
            <h1>✨ K-Pop Rankings ✨</h1>
            <button class="btn-danger" onclick="resetAllData()">Borrar todo 🗑️</button>
        </div>
    </header>

    <!-- CUERPO PRINCIPAL -->
    <main class="container">
        
        <!-- Categorías Principales (Las 6 de arriba) -->
        <div class="charts-grid" id="main-grid">
            <!-- Se inyectan con JS -->
        </div>

        <!-- Sección Exclusiva para Visuales -->
        <div class="visuals-section">
            <div class="visuals-title">🌸 VISUALES 🌸</div>
            <div class="visuals-grid" id="visuals-grid">
                <!-- Se inyectan con JS -->
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        MAMA LATINO 2026 EDITION
    </footer>

    <script>
        // Separamos las categorías para inyectarlas en diferentes lugares
        const mainCategoriesMap = {
            solistaM: "🎤 Solista Masculino",
            solistaF: "✨ Solista Femenino",
            bailarinM: "🕺 Bailarín Masculino",
            bailarinaF: "💃 Bailarina Femenina",
            raperoM: "🔥 Rapero Masculino",
            raperaF: "👑 Rapera Femenina"
        };

        const visualCategoriesMap = {
            visualM: "🌟 Visual Masculino",
            visualF: "🌸 Visual Femenino"
        };

        const allCategoriesMap = { ...mainCategoriesMap, ...visualCategoriesMap };

        const defaultData = {
            solistaM: [], solistaF: [], bailarinM: [], 
            bailarinaF: [], raperoM: [], raperaF: [],
            visualM: [], visualF: []
        };

        let appData = JSON.parse(localStorage.getItem('rankingsApp_data'));

        if (!appData) {
            appData = JSON.parse(JSON.stringify(defaultData));
        } else {
            for (const key in defaultData) {
                if (!appData[key]) {
                    appData[key] = [];
                }
            }
        }

        function saveData() {
            localStorage.setItem('rankingsApp_data', JSON.stringify(appData));
        }

        // Función auxiliar para construir el HTML de una tarjeta
        function buildCardHtml(key, title) {
            const categoryData = appData[key];
            const maxPoints = Math.max(...categoryData.map(c => c.points), 100);
            let competitorsHtml = '';
            
            if (categoryData.length === 0) {
                competitorsHtml = `<div class="empty-state">Agrega a tu fav aquí 💖</div>`;
            } else {
                categoryData.forEach(comp => {
                    const percentage = Math.min((comp.points / maxPoints) * 100, 100);
                    competitorsHtml += `
                        <div class="competitor">
                            <div class="name" title="${comp.name}">${comp.name}</div>
                            <div class="bar-container">
                                <div class="bar" style="width: ${percentage}%">${comp.points}</div>
                            </div>
                            <div class="controls">
                                <button onclick="changePoints('${key}', ${comp.id}, -1)">-</button>
                                <button onclick="changePoints('${key}', ${comp.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            return `
                <div class="chart-card">
                    <div class="chart-header">
                        <h2>${title}</h2>
                        <div class="chart-actions">
                            <button onclick="sortCategory('${key}')">🏆 Ordenar</button>
                            <button onclick="addCompetitor('${key}')">➕ Añadir</button>
                        </div>
                    </div>
                    <div class="chart-content">
                        ${competitorsHtml}
                    </div>
                </div>
            `;
        }

        function renderAll() {
            // Renderizar Main Grid (Las primeras 6)
            const mainGrid = document.getElementById('main-grid');
            mainGrid.innerHTML = '';
            for (const [key, title] of Object.entries(mainCategoriesMap)) {
                mainGrid.innerHTML += buildCardHtml(key, title);
            }

            // Renderizar Visuals Grid (Las últimas 2)
            const visualsGrid = document.getElementById('visuals-grid');
            visualsGrid.innerHTML = '';
            for (const [key, title] of Object.entries(visualCategoriesMap)) {
                visualsGrid.innerHTML += buildCardHtml(key, title);
            }
        }

        function changePoints(categoryKey, id, amount) {
            const competitor = appData[categoryKey].find(c => c.id === id);
            if (competitor) {
                competitor.points += amount;
                if (competitor.points < 0) competitor.points = 0;
                saveData();
                renderAll(); 
            }
        }

        function sortCategory(categoryKey) {
            appData[categoryKey].sort((a, b) => b.points - a.points);
            saveData();
            renderAll();
        }

        function addCompetitor(categoryKey) {
            const title = allCategoriesMap[categoryKey];
            const name = prompt(`🌟 Introduce el nombre para ${title}:`);
            if (name && name.trim() !== '') {
                const newId = Date.now(); 
                appData[categoryKey].push({ id: newId, name: name.trim(), points: 0 });
                saveData();
                renderAll();
            }
        }

        function resetAllData() {
            if (confirm("¿Seguro que quieres borrar a todos los artistas? 🥺 Esta acción no se puede deshacer.")) {
                appData = JSON.parse(JSON.stringify(defaultData));
                saveData();
                renderAll();
            }
        }

        renderAll();
    </script>
</body>
</html>
